apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.image }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/local/apache2/htdocs/
      volumes:
        - name: html
          configMap:
            name: {{ .Values.name }}-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-html
data:
  index.html: |
    <html>
      <body>
        <h1>Hello World from Apache!</h1>
      </body>
    </html>
