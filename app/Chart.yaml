apiVersion: v2
name: app
description: A Helm chart for Kubernetes
type: application
version: 0.1.0
appVersion: "1.16.0"

# Dependencias a subcharts

dependencies:

- name: dns_interceptor
  version: 1.0.0
  repository: "file://charts/dns_interceptor"
  condition: dns_interceptor.enabled
- name: apache_server
  version: 1.0.0
  repository: "file://charts/apache_server"
  condition: apache_server.enabled
- name: rest_api_simple
  version: 1.0.0
  repository: "file://charts/rest_api_simple"
  condition: rest_api_simple.enabled
